name: MoongchiNameFix
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: '14.0'
# Debug: development and QA. AppStore: the one product, for the Mac App Store, inside the App Sandbox (D-038).
configs:
  Debug: debug
  AppStore: release
settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    # Debug runs outside the sandbox so fixtures and renders can write where they need to;
    # eng/build.sh --sandbox-debug builds the Debug app inside it for the real-sandbox checks.
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 6
packages:
  Runtime:
    path: .
targets:
  MoongchiNameFix:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        excludes:
          - Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: Moongchi NameFix
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      # The released app and the development app never share an identifier.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.moongchi.namefix.dev
        AppStore:
          PRODUCT_BUNDLE_IDENTIFIER: com.ailoworks.namefix
          # No debugging entitlement in what gets submitted.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
          ENABLE_APP_SANDBOX: YES
          CODE_SIGN_ENTITLEMENTS: App/NameFix-AppStore.entitlements
    dependencies:
      - package: Runtime
        product: NameFixApplication
      - package: Runtime
        product: NameFixRuntime
    scheme:
      testTargets:
        - NameFixUITests
  NameFixUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/UITests
    dependencies:
      - target: MoongchiNameFix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moongchi.namefix.uitests
        GENERATE_INFOPLIST_FILE: YES
