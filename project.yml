name: MoongchiNameFix
options:
  minimumXcodeGenVersion: 2.40.0
  deploymentTarget:
    macOS: '14.0'
settings:
  base:
    ARCHS: arm64
    VALID_ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: '14.0'
    CODE_SIGN_IDENTITY: '-'
    CODE_SIGN_STYLE: Manual
    ENABLE_HARDENED_RUNTIME: YES
    ENABLE_APP_SANDBOX: NO
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 3
packages:
  Runtime:
    path: .
targets:
  MoongchiNameFix:
    type: application
    platform: macOS
    sources:
      - path: App
      - path: Resources
        excludes:
          - Localizable.xcstrings
    settings:
      base:
        PRODUCT_NAME: Moongchi NameFix
        PRODUCT_BUNDLE_IDENTIFIER: com.moongchi.namefix.dev
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - package: Runtime
        product: NameFixApplication
      - package: Runtime
        product: NameFixRuntime
    scheme:
      testTargets:
        - NameFixUITests
  NameFixUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: Tests/UITests
    dependencies:
      - target: MoongchiNameFix
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moongchi.namefix.uitests
        GENERATE_INFOPLIST_FILE: YES
